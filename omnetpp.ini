[General]
network = CsmaCdLan
sim-time-limit = 20s
repeat = 3                          # 3 seed/diem -> lay trung binh (giam tu 5 cho nhanh)
**.scalar-recording = true
**.vector-recording = false
result-dir = results

# =====================================================================
#  FIX QUAN TRONG: BAT CSMA/CD (ban song cong)
#  duplexMode=true (mac dinh) = song cong -> KHONG co CSMA/CD.
#  duplexMode=false           = ban song cong -> CO CSMA/CD + va dap + backoff.
# =====================================================================
*.host[*].eth.mac.duplexMode = false

# ============================ BASELINE ============================
# 10 tram noi chung 1 HUB (1 mien dung do), kenh 10Mbps.
# host[0] CHI THU; cac host khac gui ve host[0].
*.numHosts = 10
**.channel.datarate = 10Mbps
**.channel.delay    = 0.5us
*.host[0].cli.destAddress  = ""
*.host[*].cli.destAddress  = "host[0]"
*.host[*].cli.reqLength    = 1000B
*.host[*].cli.respLength   = 0B
*.host[*].cli.sendInterval = exponential(0.01s)
*.host[*].cli.startTime    = uniform(0s, 0.01s)

# =====================================================================
# PHASE 1 - THAY DOI TAN SUAT GUI (bien: sendInterval) -> duong S-G
# =====================================================================
[Config Phase1_TanSuat]
description = "Phase 1 - doi TAN SUAT GUI -> S-G"
*.host[*].cli.sendInterval = exponential(${I=0.16,0.08,0.04,0.02,0.0133,0.01,0.008,0.0062,0.0047,0.0032,0.0023,0.0016}s)

# =====================================================================
# PHASE 2 - THAY DOI SO TRAM (bien: numHosts) -> duong S-G
# =====================================================================
[Config Phase2_SoTram]
description = "Phase 2 - doi SO TRAM -> S-G"
*.numHosts = ${N=2,5,8,10,15,20,30,40,60,100}

# =====================================================================
# PHASE 3 - THAY DOI CHIEU DAI CAP (bien: delay) -> duong eta-a
#   frame 64B co dinh; chi doi cap. a = 2*delay/t_trans, t_trans=51.2us.
# =====================================================================
[Config Phase3_ChieuDaiCap]
description = "Phase 3 - doi CHIEU DAI CAP -> eta-a"
*.host[*].cli.reqLength    = 64B
*.host[*].cli.sendInterval = exponential(0.001s)
**.channel.delay = ${d=0.13us,0.26us,0.51us,1.02us,1.79us,2.56us,3.84us,6.4us,10.24us,15.36us,20.48us,25.6us}

# =====================================================================
# PHASE 4 - THAY DOI KICH THUOC GOI (bien: reqLength) -> duong eta-a
#   cap 12.8us co dinh; chi doi goi. Khoa tai (sendInterval ti le L).
# =====================================================================
[Config Phase4_KichThuocGoi]
description = "Phase 4 - doi KICH THUOC GOI -> eta-a"
**.channel.delay = 12.8us
*.host[*].cli.reqLength = ${L=64,128,256,512,768,1024,1500}B
*.host[*].cli.sendInterval = exponential(${L} * 16us)

# =====================================================================
# IDEAL - mo hinh CSMA/CD ly tuong (mang rieng IdealCsmaCdNet).
# Da chay xong, giu lai cho day du. Dong duplexMode o tren khong
# anh huong gi (mang nay khong co MAC).
# =====================================================================
[Config Ideal_SweepCap]
description = "Ideal - quet chieu dai cap -> eta vs a"
network = IdealCsmaCdNet
*.node.numStations = 10
*.node.pkLenBits   = 512
*.node.txRate      = 10e6
*.node.propSpeed   = 2e8
*.node.cableLength = ${cab=52m,104m,204m,408m,716m,1024m,1536m,2560m,4096m,6144m,8192m,10240m}
