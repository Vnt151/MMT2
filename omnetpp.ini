[General]
network = CsmaCdLan
sim-time-limit = 60s
repeat = 5                          # moi diem chay 5 lan (5 seed) -> lay trung binh
**.scalar-recording = true
**.vector-recording = false
result-dir = results

# ============================ BASELINE ============================
# 10 tram, kenh 10Mbps, cap ~100m, frame 1000B.
# host[0] CHI THU; cac host khac gui ve host[0].
*.numHosts = 10
**.channel.datarate = 10Mbps
**.channel.delay    = 0.5us
*.host[0].cli.destAddress  = ""
*.host[*].cli.destAddress  = "host[0]"
*.host[*].cli.reqLength    = 1000B
*.host[*].cli.respLength   = 0B
*.host[*].cli.sendInterval = exponential(0.01s)
*.host[*].cli.startTime    = uniform(0s, 0.01s)

# =================================================================
# PHASE 1 - THAY DOI TAN SUAT GUI GOI  (bien: sendInterval)
#   Doi thoi gian trung binh giua 2 lan gui -> doi TAI G.
#   Co dinh: N=10, L=1000B, R=10M, cap 100m.
#   12 muc, G ~ 0.05 -> 5  ->  ve duong Throughput S theo tai G.
# =================================================================
[Config Phase1_TanSuat]
description = "Phase 1 - doi TAN SUAT GUI GOI (sendInterval) -> duong S-G"
*.host[*].cli.sendInterval = exponential(${I=0.16,0.08,0.04,0.02,0.0133,0.01,0.008,0.0062,0.0047,0.0032,0.0023,0.0016}s)

# =================================================================
# PHASE 2 - THAY DOI SO LUONG TRAM  (bien: numHosts)
#   Cang nhieu tram -> tai G cang cao (cach thu 2 de doi G).
#   Co dinh: L=1000B, R=10M, cap 100m, sendInterval baseline.
#   10 muc, N = 2 -> 100.
# =================================================================
[Config Phase2_SoTram]
description = "Phase 2 - doi SO LUONG TRAM (numHosts) -> tranh chap tang"
*.numHosts = ${N=2,5,8,10,15,20,30,40,60,100}

# =================================================================
# PHASE 3 - THAY DOI CHIEU DAI CAP  (bien: delay)
#   Doi tre lan truyen -> doi tham so a = t_prop/t_trans.
#   Dung frame nho (64B) + tai nang de kenh bao hoa; chi doi cap.
#   Day la cach SACH nhat de co lap a (t_trans giu nguyen).
#   12 muc, a ~ 0.005 -> 1.0  ->  ve duong hieu suat eta theo a (so 1/(1+5a)).
# =================================================================
[Config Phase3_ChieuDaiCap]
description = "Phase 3 - doi CHIEU DAI CAP (delay) -> eta vs a"
*.host[*].cli.reqLength    = 64B
*.host[*].cli.sendInterval = exponential(0.001s)
**.channel.delay = ${d=0.13us,0.26us,0.51us,1.02us,1.79us,2.56us,3.84us,6.4us,10.24us,15.36us,20.48us,25.6us}

# =================================================================
# PHASE 4 - THAY DOI KICH THUOC GOI  (bien: reqLength)
#   Doi do dai frame -> doi t_trans -> doi tham so a (cach thu 2).
#   Co dinh cap dai 12.8us + tai nang; chi doi kich thuoc goi.
#   7 muc, L = 64B -> 1500B  (a ~ 0.5 -> 0.02).
# =================================================================
[Config Phase4_KichThuocGoi]
description = "Phase 4 - doi KICH THUOC GOI (reqLength) -> eta vs a (cach 2)"
**.channel.delay = 12.8us
*.host[*].cli.reqLength = ${L=64,128,256,512,768,1024,1500}B
# Khoa tai co dinh G~0.5 (gan dinh) -> sendInterval ti le theo L
*.host[*].cli.sendInterval = exponential(${L} * 16us)
